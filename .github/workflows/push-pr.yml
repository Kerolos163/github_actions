on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Install dependencies
        working-directory: ./src
        run: npm ci
      - name: Run tests
        working-directory: ./src
        run: npm run test
